[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echo-mind"
version = "1.0.0"
description = "EchoMind: Production-Grade Cognitive Architecture for QQ Agent built on NoneBot2 & Hexagonal Clean Architecture"
readme = "docs/ARCHITECTURE_CONTRACTS.md"
requires-python = ">=3.11"
dependencies = [
    "nonebot2[fastapi,websockets,httpx]>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pillow>=10.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pylint>=3.1.0",
    "radon>=6.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/echomind"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = []
plugin_dirs = ["src/echomind/extensions"]
builtin_plugins = []

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "C901", "S", "SIM", "RET", "C4", "PLR"]
ignore = ["S101", "PLR2004", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.pylint.main]
disable = "all"
enable = ["R1702", "R0912", "R0915"]

[tool.pylint.refactoring]
max-nested-blocks = 2

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"
